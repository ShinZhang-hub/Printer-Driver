<h1>インデックス紙プリント</h1>

<h2>インデックス紙プリント</h2>
<p>チェックすると、用紙に対して、画像をタブ幅分だけ移動して印刷できます。また、移動して空いた部分に、タブ紙のタブ部分を印刷します。</p>

<h2>移動値</h2>
<p><!--「インデックス紙プリント」機能を使用する場合の、-->インデックス紙のタブ幅を指定します。
ミリ単位の場合は<!-- 0～15mm -->0.0～15.0mmの範囲で0.1mm刻みに、インチ単位の場合は0.00～0.59inchの範囲で0.01inch刻みに指定できます。
キー入力、または▲▼ボタンで指定します。</p>

<h2>単位</h2>
<p>［移動値］の単位表示を、ミリまたはインチに切り替えます。</p>
