<body>

<h1>断裁</h1>

<h2>断裁</h2>
<p>二つ折りされた用紙の背の反対側を断裁します。背とは、用紙がとじられた辺になります。</p>

<h2>仕上がりサイズ</h2>
<p>断裁したあとの仕上がりのサイズを指定します。<br>
仕上がりのサイズは、ミリ単位の場合は0.1mm刻みに、インチ単位の場合は0.01inch刻みに指定できます。キー入力、または▲▼ボタンで指定します。<br>
仕上がりのサイズは、印刷する用紙によって異なります。<br>
断裁できる用紙サイズは、A3、A4、B4、8.5x11" (レター)、11x17" になります。</p>

<h2>単位</h2>
<p>［断裁］の単位表示を、ミリまたはインチに切り替えます。</p>
