<body>

<h1>［中とじしろをつける］ダイアログボックス</h1>

<p>二つ折りにしたとき、中とじ部分の印字が見えにくくなるのを防ぐために、用紙の中央に中とじしろを付けます。</p>

<h2>とじしろ幅</h2>

<p>中とじしろの幅を指定します。
ミリ単位の場合は0～25mmの範囲で1mm刻みに、インチ単位の場合は0.0～1.0inchの範囲で0.1inch刻みに指定できます。キー入力、または▲▼ボタンで指定します。
</p>
<p>指定した中とじしろは、それぞれのページの内側に付きます。</p>

<h2>単位</h2>
<p>［とじしろ幅］の単位表示を、ミリまたはインチに切り替えます。</p>

</body>
